[project]
name = "dialeng"
version = "0.1.0"
description = "Open source Solveit-like notebook with FastHTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "python-fasthtml>=0.12.0",
    "execnb>=0.1.15",
    "fastcore>=1.5.0",

    # Rich output and notebook utilities
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",

    # Course study assistant notebook
    "yt-dlp>=2024.1.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "contextpack",
    "nbs2ctx",

    # LLM integration
    "claudette>=0.2.0",
    "anthropic>=0.40.0",
    "claudette-agent @ git+https://github.com/sgaseretto/claudette-agent.git",

    # ContextKit for reading context from various sources
    "contextkit",

    # AWS support for Bedrock
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # dialoghelper for solveit compatibility
    "dialoghelper",
    "tracefunc",

    # Lucide icons in FastHTML
    "fastlucide",

    # Shell execution support
    "pshnb",
    "pexpect>=4.9.0",
    "safecmd",

    # Safe Python sandbox for LLM tool execution
    "safepyrun",

    # Extended markdown rendering (subscript, superscript, emoji, etc.)
    "mistlefoot",

    # nbdev for notebook export
    "nbdev",
]

[project.scripts]
dialeng = "dialeng.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dialeng"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
