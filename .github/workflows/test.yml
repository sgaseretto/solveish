name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: Unit and integration tests
        run: >-
          uv run pytest -q
          -m "not e2e and not external_openai and not external_claude and not external_colab"

  browser-e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Deterministic browser scenarios
        run: uv run pytest -q -m e2e tests/e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dialeng-playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
